; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rymcu-esp32-devkitc]
platform = espressif32
board = rymcu-esp32-devkitc
framework = arduino, espidf
test_framework = unity
build_flags = 
    -D CONFIG_ESP_TASK_WDT_TIMEOUT_S=20
	-D TINY_GSM_YIELD_MS=2
lib_ldf_mode = deep+
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter, esp32_exception_decoder, log2file
lib_deps = 
	mikalhart/TinyGPSPlus@^1.1.0
	adafruit/Adafruit INA219@^1.2.3
	knolleary/PubSubClient @ ^2.8
	vshymanskyy/TinyGSM @ ^0.12.0
	mobizt/ESP_SSLClient @ ^3.1.3
	lennarthennigs/ESP Telnet @ ^2.2.3
	bblanchon/ArduinoJson @ ^7.4.3
	mabuware/MabuTrace@^1.0.3
	

board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

; ini yg pake USB
upload_protocol = esptool

